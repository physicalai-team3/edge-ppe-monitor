<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPE 관제</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PPE 관제</h1>
    <div class="header-right">
      <button id="sound" type="button" aria-pressed="false">알림 소리 켜기</button>
      <span id="conn" class="badge">연결 중…</span>
    </div>
  </header>

  <!-- 오늘(KST 0시~) 통계: 전체 / 안전모 / 조끼. 같은 위반자는 30초마다 1건씩 기록된다 -->
  <section id="stats" class="stats">
    <div><span id="stat-total">0</span><small>오늘 위반 기록</small></div>
    <div><span id="stat-helmet">0</span><small>안전모 미착용</small></div>
    <div><span id="stat-vest">0</span><small>조끼 미착용</small></div>
  </section>
  <p id="stat-devices" class="stat-devices"></p>

  <!-- (2차) 장치 상태 -->
  <section id="devices" class="devices" hidden></section>

  <!-- 실시간 위반 피드 (최신이 위) -->
  <main id="feed" class="feed"></main>

  <!-- 새 위반 알림 -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <template id="card-tpl">
    <article class="card">
      <div class="photo">
        <img alt="위반 사진">
        <button type="button" class="photo-missing">사진 없음 · 눌러서 다시 불러오기</button>
      </div>
      <div class="meta">
        <strong class="types"></strong>
        <span class="device"></span>
        <span class="persons"></span>
        <time></time>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
